name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Lint, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WETUBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WETUBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WETUBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WETUBE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wetube.jks"
            {
              echo "WETUBE_KEYSTORE_PATH=$RUNNER_TEMP/wetube.jks"
              echo "WETUBE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "WETUBE_KEY_ALIAS=$KEY_ALIAS"
              echo "WETUBE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release APK will be signed with the configured key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No signing secret set; the release APK falls back to the debug key." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wetube-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wetube-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
