name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Lint, build, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # GitHub's Ubuntu images ship the SDK. We only install what is missing,
      # and we call sdkmanager directly: android-actions/setup-android still
      # asks for the legacy "tools" package, which current cmdline-tools no
      # longer provide, and that fails the job before anything is built.
      - name: Android SDK
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$sdk_root" && test -d "$sdk_root" || {
            echo "::error::No Android SDK on this runner"; exit 1; }
          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_bin" ]; then
            sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -maxdepth 3 -name sdkmanager -type f | sort | tail -1)"
          fi
          if [ ! -d "$sdk_root/platforms/android-35" ] || [ ! -d "$sdk_root/build-tools/35.0.0" ]; then
            yes | "$sdkmanager_bin" --licenses > /dev/null || true
            yes | "$sdkmanager_bin" "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.WETUBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WETUBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WETUBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WETUBE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wetube.jks"
            {
              echo "WETUBE_KEYSTORE_PATH=$RUNNER_TEMP/wetube.jks"
              echo "WETUBE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "WETUBE_KEY_ALIAS=$KEY_ALIAS"
              echo "WETUBE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release APK will be signed with the configured key." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No signing secret set; the release APK falls back to the debug key." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Lint
        run: ./gradlew lintDebug

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wetube-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wetube-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish release for tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
